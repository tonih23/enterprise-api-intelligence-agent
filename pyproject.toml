[project]
name = "enterprise-api-intelligence-agent"
version = "0.1.0"
description = "An enterprise-style agent for governed retrieval over synthetic API documentation."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "google-genai>=1.0.0,<2.0.0",
    "langgraph>=1.0.0,<2.0.0",
    "langsmith>=0.8.0,<1.0.0",
    "mcp[cli]>=1.23.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0,<2.0.0",
    "opentelemetry-sdk>=1.30.0,<2.0.0",
    "opensearch-py>=2.8.0,<4.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "sentence-transformers>=3.4.0,<6.0.0",
    "streamlit>=1.40.0,<2.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "pytest>=8.3.0,<9.0.0",
    "ruff>=0.9.0,<1.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
